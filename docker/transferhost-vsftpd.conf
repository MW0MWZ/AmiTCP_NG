# AmiTCP_NG transfer-test host -- vsftpd config. Test infra only.
# Log in as amiga/amiga; chrooted to the /srv/share test directory, read+write.
listen=YES
listen_ipv6=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/srv/share
anonymous_enable=NO
seccomp_sandbox=NO
pam_service_name=vsftpd
# Passive mode: the entrypoint stamps pasv_address with the container's own IP so
# transfers work when the Amiga guest reaches the container directly on a bridged
# network. The port range is EXPOSEd in the Dockerfile / mapped by run-transferhost.sh.
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
xferlog_enable=YES
xferlog_std_format=YES
