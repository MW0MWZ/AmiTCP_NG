# AmiTCP_NG transfer-test host -- Samba config. Test infra only.
# Guest-accessible read/write share of /srv/share. SMB1(NT1)..SMB3 all allowed so
# both older Amiga smbfs and modern smb2fs clients work (issue #1 used SMB2).
[global]
   workgroup = WORKGROUP
   server string = AmiTCP_NG transfer test host
   security = user
   map to guest = Bad User
   guest account = amiga
   server min protocol = NT1
   server max protocol = SMB3
   smb ports = 445 139
   log level = 1
   # Wider socket buffers -- we are deliberately pushing bulk throughput.
   socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=262144 SO_SNDBUF=262144

[share]
   comment = Transfer test share
   path = /srv/share
   browseable = yes
   read only = no
   guest ok = yes
   force user = amiga
   create mask = 0664
   directory mask = 0775
